<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WayWise | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-body">
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="WayWise home">
          <span class="brand-mark">W</span>
          <span>WayWise</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="profile.html">Profile</a>
          <a href="settings.html">Settings / Contact</a>
        </nav>
        <a href="login.html" class="button button-primary nav-cta">Login / Sign Up</a>
      </div>
    </header>

    <main class="auth-page">
      <section class="auth-card">
        <div class="auth-tabs" aria-label="Authentication tabs">
          <button id="showLogin" class="tab-button active" type="button">Login</button>
          <button id="showSignup" class="tab-button" type="button">Sign Up</button>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" placeholder="your@email.com" />
          </div>
          <div class="field-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="Enter password" />
          </div>
          <div class="form-row">
            <a href="#" class="inline-link">Forgot Password</a>
          </div>
          <button type="submit" class="button button-primary full-width">Login</button>
          <p class="form-switch">
            Don’t have an account?
            <button id="switchToSignup" class="link-button" type="button">Sign Up</button>
          </p>
          <p id="loginMessage" class="form-message" aria-live="polite"></p>
        </form>

        <form id="signupForm" class="auth-form hidden" novalidate>
          <div class="field-group">
            <label for="signupName">Name</label>
            <input id="signupName" name="name" type="text" placeholder="Your full name" />
          </div>
          <div class="field-group">
            <label for="signupEmail">Email</label>
            <input id="signupEmail" name="email" type="email" placeholder="your@email.com" />
          </div>
          <div class="field-group">
            <label for="signupPassword">Password</label>
            <input id="signupPassword" name="password" type="password" placeholder="Create password" />
          </div>
          <div class="field-group">
            <label for="signupConfirmPassword">Confirm Password</label>
            <input id="signupConfirmPassword" name="confirmPassword" type="password" placeholder="Repeat password" />
          </div>
          <button type="submit" class="button button-primary full-width">Create Account</button>
          <p class="form-switch">
            Already have an account?
            <button id="switchToLogin" class="link-button" type="button">Login</button>
          </p>
          <p id="signupMessage" class="form-message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
